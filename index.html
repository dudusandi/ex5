<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EX5 Bypass - Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
            font-family: sans-serif;
        }
        
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        #main-content {
            display: none;
            padding: 20px;
            text-align: center;
            height: 100vh;
            overflow-y: auto;
        }
        
        #fullscreen-btn {
            padding: 40px 60px;
            font-size: 28px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }
        
        #fullscreen-btn:active {
            background: #0056b3;
            transform: scale(0.95);
        }
        
        .subtitle {
            color: #888;
            font-size: 16px;
            margin-top: 15px;
        }
        
        h2 { 
            font-size: 24px;
            margin-bottom: 15px;
            color: #fff;
        }
        
        button { 
            display: block; 
            padding: 20px; 
            font-size: 18px; 
            margin: 12px auto; 
            width: 95%; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            cursor: pointer; 
        }
        
        button:active { 
            background: #0056b3; 
            transform: scale(0.98); 
        }
        
        .planb { 
            background: #28a745; 
            display: block; 
            padding: 20px; 
            border-radius: 15px; 
            margin: 20px auto; 
            width: 95%; 
            font-size: 18px; 
            text-align: center; 
            cursor: pointer; 
        }
        
        .info { 
            color: #ccc; 
            font-size: 14px; 
            margin-bottom: 20px; 
            line-height: 1.5; 
        }
        
        #status { 
            background: #222; 
            border: 1px solid #444; 
            padding: 12px; 
            margin: 15px auto; 
            width: 95%; 
            border-radius: 10px; 
            font-family: monospace; 
            font-size: 12px; 
            color: #ffeb3b; 
            text-align: left; 
            max-height: 120px; 
            overflow-y: auto; 
        }
    </style>
</head>
<body>
    <!-- Tela inicial com botão de fullscreen -->
    <div id="start-screen">
        <button id="fullscreen-btn" onclick="enterFullscreen()">
            📱 ENTRAR EM TELA CHEIA
        </button>
        <div class="subtitle">Toque para esconder o menu do carro</div>
    </div>

    <!-- Conteúdo principal (mesmo do seu código original) -->
    <div id="main-content">
        <h2>Instalação Direta (Bypass) - EX5</h2>
        <p class="info">Tentativa de acesso via Intent e rotas USB. Acompanhe o status abaixo.</p>
        
        <div id="status">Status: Pronto. Aguardando ação...</div>

        <button id="btn1">Tentar Caminho 1 (UDISK)</button>
        <button id="btn2">Tentar Caminho 2 (usb_storage)</button>
        <button id="btn3">Tentar Caminho 3 (usb1)</button>
        <button id="btn4">Tentar Caminho 4 (usbotg)</button>
        
        <label class="planb">
            PLANO B: Selecionar APK Manualmente
            <input type="file" accept=".apk,application/vnd.android.package-archive" style="display:none;" id="filePicker">
        </label>
    </div>

    <script>
        function enterFullscreen() {
            const elem = document.documentElement;
            
            // Tenta múltiplos métodos de fullscreen
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.log("Erro fullscreen:", err);
                });
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            }
            
            // Esconde tela inicial e mostra conteúdo
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        const logBox = document.getElementById('status');
        function log(msg) {
            console.log(msg);
            logBox.innerHTML += "<br>> " + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        const pkgType = "application/vnd.android.package-archive";
        const fileName = "aptoide.apk"; 

        const paths = [
            "/storage/UDISK/",
            "/storage/usb_storage/",
            "/storage/usb1/",
            "/storage/usbotg/",
            "/mnt/usb_storage/",
            "/storage/emulated/0/UDISK/"
        ];

        function createIntent(path) {
            const filePath = path + fileName;
            log("Gerando intent para: " + filePath);
            return "intent://" + filePath.replace("://", "") + "#Intent;scheme=file;type=" + pkgType + ";action=android.intent.action.VIEW;end";
        }

        const buttons = document.querySelectorAll('button');
        buttons.forEach((btn, index) => {
            if (paths[index]) {
                btn.onclick = function(e) {
                    e.preventDefault();
                    log("Botão " + (index + 1) + " clicado. Rota: " + paths[index]);
                    try {
                        const targetUrl = createIntent(paths[index]);
                        log("Disparando redirecionamento...");
                        window.location.href = targetUrl;
                    } catch (err) {
                        log("Erro: " + err.message);
                    }
                };
            } else {
                btn.style.display = 'none';
            }
        });

        document.getElementById('filePicker').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                log("Arquivo selecionado: " + file.name + " (" + file.size + " bytes)");
                alert('Arquivo reconhecido pelo navegador! Nota: O navegador pode não conseguir passá-lo direto para o instalador do sistema sem permissões avançadas.');
            } else {
                log("Nenhum arquivo selecionado.");
            }
        });
    </script>
</body>
</html>
