<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EX5 Installer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        
        #fullscreen-btn {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
            border: none;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        #main-content {
            display: none;
            padding: 40px;
            text-align: center;
        }
        
        .install-btn {
            display: block;
            width: 100%;
            padding: 30px;
            margin: 20px 0;
            font-size: 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }
        
        .install-btn:active {
            background: #0056b3;
        }
        
        .status {
            margin-top: 20px;
            font-size: 18px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <!-- Botão inicial para pedir fullscreen -->
    <button id="fullscreen-btn" onclick="enterFullscreen()">
        <div style="font-size: 48px; margin-bottom: 20px;">📱</div>
        <div>TOQUE PARA ENTRAR EM TELA CHEIA</div>
        <div style="font-size: 16px; margin-top: 20px; color: #888;">
            Isso vai esconder o menu do carro
        </div>
    </button>
    
    <!-- Conteúdo principal (só aparece após fullscreen) -->
    <div id="main-content">
        <h1 style="margin-bottom: 30px;">Instalador EX5</h1>
        
        <button class="install-btn" onclick="tryInstall('/storage/emulated/12/Android/data/com.vivaldi.browser.automotive/files/Download/aptoide.apk')">
            Instalar Aptoide (Download Folder)
        </button>
        
        <button class="install-btn" onclick="tryInstall('/storage/UDISK/aptoide.apk')">
            Instalar Aptoide (USB Drive)
        </button>
        
        <button class="install-btn" onclick="tryInstall('/storage/emulated/0/Download/aptoide.apk')">
            Instalar Aptoide (Download Padrão)
        </button>
        
        <div class="status" id="status">Aguardando ação...</div>
    </div>

    <script>
        function enterFullscreen() {
            const elem = document.documentElement;
            
            // Tenta múltiplos métodos de fullscreen
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            }
            
            // Esconde o botão e mostra o conteúdo
            document.getElementById('fullscreen-btn').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            
            document.getElementById('status').textContent = 'Fullscreen ativado! Agora clique em um botão de instalação.';
        }
        
        // Detecta quando fullscreen é ativado
        document.addEventListener('fullscreenchange', function() {
            if (document.fullscreenElement) {
                console.log('Fullscreen ativado');
            } else {
                console.log('Fullscreen desativado');
            }
        });
        
        function tryInstall(filePath) {
            const status = document.getElementById('status');
            status.textContent = 'Tentando: ' + filePath;
            
            // Extrai o caminho sem a barra inicial para o intent
            const pathWithoutSlash = filePath.substring(1);
            
            // Monta o intent
            const intent = 'intent://' + pathWithoutSlash + '#Intent;scheme=file;type=application/vnd.android.package-archive;action=android.intent.action.VIEW;end';
            
            console.log('Disparando intent:', intent);
            
            try {
                window.location.href = intent;
                status.textContent = 'Intent disparado: ' + filePath;
            } catch (e) {
                status.textContent = 'Erro: ' + e.message;
            }
            
            // Tenta também com window.open
            setTimeout(() => {
                try {
                    window.open(intent, '_blank');
                    status.textContent += ' | window.open tentado';
                } catch (e) {
                    status.textContent += ' | window.open falhou';
                }
            }, 500);
        }
    </script>
</body>
</html>
