<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EX5 Bypass</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #1a1a1a; color: #fff; }
        button { display: block; padding: 25px; font-size: 22px; margin: 15px auto; width: 90%; background: #007bff; color: white; border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button:active { background: #0056b3; transform: scale(0.98); }
        .planb { background: #28a745; }
        .info { color: #ccc; font-size: 16px; margin-bottom: 30px; line-height: 1.5; }
    </style>
</head>
<body>
    <h2>Instalação Direta (Bypass)</h2>
    <p class="info">O script abaixo procura o arquivo aptoide.apk no seu Pendrive e força o Android a abrir a tela de instalação, ignorando o bloqueio do navegador.</p>
    
    <button id="btn1">Tentar Caminho 1 (UDISK)</button>
    <button id="btn2">Tentar Caminho 2 (usb_storage)</button>
    <button id="btn3">Tentar Caminho 3 (usb1)</button>
    <button id="btn4">Tentar Caminho 4 (usbotg)</button>
    
    <label class="planb" style="display:block; padding:25px; border-radius:15px; margin:30px auto; width:90%; font-size:22px; text-align:center;">
        PLANO B: Abrir Menu Nativo
        <input type="file" accept="application/vnd.android.package-archive,.apk" style="display:none;" id="filePicker">
    </label>

    <script>
        // O navegador bloqueia links com ".apk" no código HTML.
        // Nós enganamos ele montando o link via JavaScript DEPOIS que a página carrega.
        const pkgType = "application/vnd.android.package-archive";
        const fileName = "aptoide.apk"; 

        // Mapeamento de todas as portas USB possíveis no Flyme Auto / Android
        const paths = [
            "/storage/UDISK/",
            "/storage/usb_storage/",
            "/storage/usb1/",
            "/storage/usbotg/",
            "/mnt/usb_storage/",
            "/storage/emulated/0/UDISK/"
        ];

        function createIntent(path) {
            // Formato do Android Intent para forçar a leitura de arquivo local
            return "intent://" + path.substring(1) + fileName + "#Intent;scheme=file;type=" + pkgType + ";action=android.intent.action.VIEW;end";
        }

        const buttons = document.querySelectorAll('button');
        buttons.forEach((btn, index) => {
            if (paths[index]) {
                // Injeta o link dinamicamente ao clicar para burlar o filtro estático do navegador
                btn.onclick = function(e) {
                    e.preventDefault();
                    window.location.href = createIntent(paths[index]);
                };
            } else {
                btn.style.display = 'none';
            }
        });

        // PLANO B: Tenta abrir o seletor de arquivos nativo do Android (SAF)
        document.getElementById('filePicker').addEventListener('change', function() {
            alert('Se o sistema permitiu selecionar o arquivo, o Android reconheceu o pacote. Verifique se a tela de instalação abriu.');
        });
    </script>
</body>
</html>
