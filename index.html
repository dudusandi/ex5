<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EX5 Bypass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            font-family: sans-serif;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #main-content {
            width: 100vw;
            height: 100vh;
            padding: 15px;
            text-align: center;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        h2 { 
            font-size: 22px;
            margin-bottom: 10px;
            color: #fff;
            flex-shrink: 0;
        }
        
        .info { 
            color: #aaa;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
            flex-shrink: 0;
        }
        
        #status { 
            background: #222;
            border: 1px solid #444;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #ffeb3b;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        .button-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        button { 
            display: block;
            padding: 18px;
            font-size: 16px;
            margin: 8px 0;
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            font-weight: bold;
        }
        
        button:active { 
            background: #0056b3;
            transform: scale(0.97);
            opacity: 0.9;
        }
        
        .planb { 
            background: #28a745;
            padding: 18px;
            border-radius: 12px;
            margin: 10px 0;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        
        .planb:active {
            background: #1e7e34;
            opacity: 0.9;
        }
        
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div id="main-content">
        <h2>Instalação Direta - EX5</h2>
        <p class="info">Acesso via Intent e rotas USB</p>
        
        <div id="status">Status: Pronto</div>
        
        <div class="button-container">
            <button id="btn1" onclick="tryPath(0)">1. UDISK</button>
            <button id="btn2" onclick="tryPath(1)">2. usb_storage</button>
            <button id="btn3" onclick="tryPath(2)">3. usb1</button>
            <button id="btn4" onclick="tryPath(3)">4. usbotg</button>
            
            <label class="planb" onclick="document.getElementById('filePicker').click()">
                PLANO B: Selecionar APK
            </label>
            <input type="file" accept=".apk,application/vnd.android.package-archive" id="filePicker">
        </div>
    </div>

    <script>
        const logBox = document.getElementById('status');
        function log(msg) {
            console.log(msg);
            logBox.innerHTML += "<br>> " + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        const pkgType = "application/vnd.android.package-archive";
        const fileName = "aptoide.apk"; 

        const paths = [
            "/storage/UDISK/",
            "/storage/usb_storage/",
            "/storage/usb1/",
            "/storage/usbotg/",
            "/mnt/usb_storage/",
            "/storage/emulated/0/UDISK/"
        ];

        function tryPath(index) {
            if (!paths[index]) return;
            
            const fullPath = paths[index] + fileName;
            log("Tentando: " + fullPath);
            
            // Método 1: window.location
            try {
                const intent = "intent://" + fullPath.substring(1) + "#Intent;scheme=file;type=" + pkgType + ";action=android.intent.action.VIEW;end";
                window.location.href = intent;
                log("Intent disparado (location)");
            } catch (e) {
                log("Erro location: " + e.message);
            }
            
            // Método 2: window.open (após delay)
            setTimeout(() => {
                try {
                    const intent = "intent://" + fullPath.substring(1) + "#Intent;scheme=file;type=" + pkgType + ";action=android.intent.action.VIEW;end";
                    window.open(intent, '_blank');
                    log("Intent disparado (open)");
                } catch (e) {
                    log("Erro open: " + e.message);
                }
            }, 500);
        }

        document.getElementById('filePicker').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                log("Arquivo: " + file.name + " (" + file.size + " bytes)");
                setTimeout(() => {
                    alert('Selecionado: ' + file.name + '\nSe o instalador não abriu automaticamente, o navegador pode estar bloqueando.');
                }, 100);
            }
        });
        
        // Log inicial
        log("Página carregada");
        log("User ID: " + (window.location.pathname.includes('12') ? '12' : 'desconhecido'));
    </script>
</body>
</html>
